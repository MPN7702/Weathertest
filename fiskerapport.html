<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎣 Fiskerapport</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:#e2e8f0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    color:#60a5fa;
}

label{
    display:block;
    margin-top:10px;
}

input[type="date"],
input[type="text"],
select,
textarea{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
    box-sizing:border-box;
    cursor:pointer;
}


textarea{
    min-height:100px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    cursor:pointer;
    margin-right:10px;
}

button:hover{
    background:#16a34a;
}

#reports{
    margin-top:20px;
}

.report-card{
    border-top:1px solid #475569;
    padding-top:15px;
    margin-top:15px;
}

.method{
    width:auto;
    margin-right:8px;
}
.size-group{
    display:flex;
    gap:15px;
    margin-top:5px;
    margin-bottom:35px;
    align-items:center;
}

.size-group label{
    display:inline-flex;
    align-items:center;
    gap:3px;
    margin:0;
}

.size-group input{
    width:auto;
    margin:0;
}

#rating{
    margin-top:5px;
}

.method-group{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:5px;
    margin-bottom:35px;
}

.method-group label{
    display:inline-flex;
    align-items:center;
    gap:3px;
    margin:0;
}

.method-group input{
    width:auto;
    margin:0;
}
</style>
</head>

<body>

<div class="container">

<h1>🎣 Fiskerapport</h1>

<label>Datum</label>
<input type="date" id="date">

<label>Fiskevatten</label>

<select id="place">

    <option>Fryken</option>
    <option>Vassjön</option>
    <option>Letten</option>
    <option>Höljessjön</option>
    <option>Mangen</option>
    <option>Grängen</option>
    <option>Annat vatten</option>

</select>

<div id="customPlaceContainer" style="display:none;">

<label>Annat fiskevatten (valfritt)</label>

<input
    type="text"
    id="customPlace"
    placeholder="Skriv fiskevatten här">

</div>

<label>Starttid</label>
<select id="startTime">

    <option>00</option>
    <option>01</option>
    <option>02</option>
    <option>03</option>
    <option>04</option>
    <option>05</option>
    <option>06</option>
    <option>07</option>
    <option>08</option>
    <option>09</option>
    <option>10</option>
    <option>11</option>
    <option>12</option>
    <option>13</option>
    <option>14</option>
    <option>15</option>
    <option>16</option>
    <option>17</option>
    <option selected>18</option>
    <option>19</option>
    <option>20</option>
    <option>21</option>
    <option>22</option>
    <option>23</option>

</select>

<label>Sluttid</label>
<select id="endTime">

    <option>00</option>
    <option>01</option>
    <option>02</option>
    <option>03</option>
    <option>04</option>
    <option>05</option>
    <option>06</option>
    <option>07</option>
    <option>08</option>
    <option>09</option>
    <option>10</option>
    <option>11</option>
    <option>12</option>
    <option>13</option>
    <option>14</option>
    <option>15</option>
    <option>16</option>
    <option>17</option>
    <option>18</option>
    <option>19</option>
    <option>20</option>
    <option>21</option>
    <option selected>22</option>
    <option>23</option>

</select>

<label>Gäddor</label>
<select id="pike"></select>

<div class="size-group">

<label><input type="checkbox" class="pikeSize" value="Små">Små</label>

<label><input type="checkbox" class="pikeSize" value="Medel">Medel</label>

<label><input type="checkbox" class="pikeSize" value="Stora">Stora</label>

</div>

<label>Abborrar</label>
<select id="perch"></select>

<div class="size-group">

<label>
<input type="checkbox" class="perchSize" value="Små">
Små
</label>

<label>
<input type="checkbox" class="perchSize" value="Medel">
Medel
</label>

<label>
<input type="checkbox" class="perchSize" value="Stora">
Stora
</label>

</div>

<label>Gösar</label>
<select id="zander"></select>


<div class="size-group">

<label><input type="checkbox" class="zanderSize" value="Små">Små</label>

<label><input type="checkbox" class="zanderSize" value="Medel">Medel</label>

<label><input type="checkbox" class="zanderSize" value="Stora">Stora</label>

</div>

<label style="margin-top:20px;">Fiskeupplevelse</label>

<select id="rating">
    <option>Mycket dåligt</option>
    <option>Dåligt</option>
    <option selected>Normalt</option>
    <option>Bra</option>
    <option>Mycket bra</option>
</select>

<label>Kommentar / observationer</label>

<textarea id="comment"></textarea>

<button onclick="saveReport()">
💾 Spara rapport
</button>

<button
    id="reportsButton"
    onclick="showReports()">
    📊 Visa rapporter
</button>

<div id="reports"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDJZ2AVFOmrJC6RbkiwglerTVsUJ1Dhqwk",
    authDomain: "fryken-fiskerapporter.firebaseapp.com",
    projectId: "fryken-fiskerapporter",
    storageBucket: "fryken-fiskerapporter.firebasestorage.app",
    messagingSenderId: "1039915615968",
    appId: "1:1039915615968:web:059f48e50aef7c56bf3285"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db = db;
window.addDoc = addDoc;
window.getDocs = getDocs;
window.collection = collection;

window.saveReport = async function(){
const selectedDate =
    document.getElementById("date").value;

const selectedPlace =
    document.getElementById("place").value;

const response =
    await fetch(
        `https://fiske-predictions.mr-magoo21.workers.dev?date=${selectedDate}`
    );

const weatherData =
    await response.json();

const prediction =
    weatherData.orter?.[
        selectedPlace
    ] || {};

const pikeSizes =
    Array.from(
        document.querySelectorAll(".pikeSize:checked")
    ).map(x => x.value);

const perchSizes =
    Array.from(
        document.querySelectorAll(".perchSize:checked")
    ).map(x => x.value);

const zanderSizes =
    Array.from(
        document.querySelectorAll(".zanderSize:checked")
    ).map(x => x.value);
    const report = {

        datum:
            document.getElementById("date").value,

fiskevatten:
    document.getElementById("place").value === "Annat vatten"
        ? document.getElementById("customPlace").value
        : document.getElementById("place").value,

        startTid:
            document.getElementById("startTime").value,

        slutTid:
            document.getElementById("endTime").value,

gaddaStorlek:
    pikeSizes,

abborreStorlek:
    perchSizes,

gosStorlek:
    zanderSizes,
        gadda:
            Number(
                document.getElementById("pike").value
            ),

        abborre:
            Number(
                document.getElementById("perch").value
            ),

        gos:
            Number(
                document.getElementById("zander").value
            ),

        betyg:
            document.getElementById("rating").value,

        kommentar:
            document.getElementById("comment").value,

        prognos:
            prediction
    };

await addDoc(
    collection(db, "reports"),
    report
);

    alert("✅ Rapport sparad");

location.reload();
}

window.showReports = async function(){

    const reportsDiv =
        document.getElementById("reports");

    const button =
        document.getElementById("reportsButton");

    if(reportsDiv.innerHTML.trim() !== ""){

        reportsDiv.innerHTML = "";

        button.textContent =
            "📊 Visa rapporter";

        return;

    }

const snapshot =
    await getDocs(
        collection(db, "reports")
    );

const reports =
    snapshot.docs.map(doc => doc.data());

    let html = "";

    reports.slice().reverse().forEach(r => {

        html += `

        <div class="report-card">

        <strong>${r.datum || "-"}</strong><br>

🌊 Fiskevatten:
${r.fiskevatten || "-"}<br>

        🕓 Fisketid:
${r.startTid || "-"}:00 - ${r.slutTid || "-"}:00

🐊 Gädda:
${r.gadda}
(${r.gaddaStorlek?.join(", ") || "-"})<br>

🐟 Abborre:
${r.abborre}
(${r.abborreStorlek?.join(", ") || "-"})<br>

🐟 Gös:
${r.gos}
(${r.gosStorlek?.join(", ") || "-"})<br><br>
        🎣 Betyg:
        ${r.betyg}<br><br>

        <strong>Prognosdata</strong><br>

        Temperatur:

${r.prognos?.tempMin ?? "-"}°C -
${r.prognos?.tempMax ?? "-"}°C<br>

Lufttryck:
${r.prognos?.pressure ?? "-"} hPa<br>

Vind:
${r.prognos?.wind ?? "-"} m/s<br>

Kastvind:
${r.prognos?.windGust ?? "-"} m/s<br>

Regn:
${r.prognos?.rain ?? "-"} mm<br>

Väderkod:
${r.prognos?.weathercode ?? "-"}<br>

Soluppgång:
${r.prognos?.sunrise ?? "-"}<br>

Solnedgång:
${r.prognos?.sunset ?? "-"}<br><br>

        📝 Kommentar:<br>
        ${r.kommentar || "-"}<br>

        </div>

        `;

    });
button.textContent =
    "❌ Dölj rapporter";
    reportsDiv.innerHTML = html;

}
const today = new Date();

today.setMinutes(
    today.getMinutes() -
    today.getTimezoneOffset()
);

document.getElementById("date").value =
    today.toISOString().split("T")[0];
for(let i = 0; i <= 50; i++){

    document.getElementById("pike").innerHTML +=
        `<option value="${i}">${i}</option>`;

    document.getElementById("perch").innerHTML +=
        `<option value="${i}">${i}</option>`;

    document.getElementById("zander").innerHTML +=
        `<option value="${i}">${i}</option>`;
}
document.getElementById("place")
.addEventListener("change", function(){

    document.getElementById("customPlaceContainer")
        .style.display =
            this.value === "Annat vatten"
                ? "block"
                : "none";

});
</script>


</body>
</html>
