<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMHI Test</title>
</head>
<body>

<h1>SMHI Test</h1>

<div id="output">Laddar...</div>
<hr>

<h1>YR Test</h1>

<div id="yrOutput">
Laddar YR...
</div>
<script>

async function loadSMHI() {

    const response = await fetch(
        "https://smhi-proxy.mr-magoo21.workers.dev/"
    );

const json = await response.json();

console.log(json.timeSeries.length);

console.log(
    json.timeSeries[
        json.timeSeries.length - 1
    ].time
);
    const rows = json.timeSeries
        .slice(0, 999)
        .map(item => `
            <tr>
                <td>${item.time}</td>
                <td>${item.data.air_temperature}</td>
                <td>${item.data.wind_speed}</td>
                <td>${item.data.wind_speed_of_gust}</td>
                <td>${item.data.wind_from_direction}</td>
                <td>${item.data.air_pressure_at_mean_sea_level}</td>
                <td>${item.data.relative_humidity}</td>
                <td>${item.data.cloud_area_fraction}</td>
                <td>${item.data.low_type_cloud_area_fraction}</td>
                <td>${item.data.medium_type_cloud_area_fraction}</td>
                <td>${item.data.high_type_cloud_area_fraction}</td>
                <td>${item.data.visibility_in_air}</td>
                <td>${item.data.precipitation_amount_mean}</td>
                <td>${item.data.probability_of_precipitation}</td>
                <td>${item.data.thunderstorm_probability}</td>

<td>${item.data.symbol_code}</td>

<td>${item.data.probability_of_frozen_precipitation}</td>

<td>${item.data.predominant_precipitation_type_at_surface}</td>
            </tr>
        `)
        .join("");

    document.getElementById("output").innerHTML = `
        <table border="1">
            <tr>
                <th>Tid</th>
                <th>Temp</th>
                <th>Vind</th>
                <th>Kastvind</th>
                <th>Vindriktning</th>
                <th>Tryck</th>
                <th>Fukt</th>
                <th>Moln</th>
                <th>Låga moln</th>
                <th>Mellanmoln</th>
                <th>Höga moln</th>
                <th>Sikt</th>
                <th>Regn</th>
                <th>Regn %</th>
                <th>Åska %</th>
                <th>Väderkod</th>
<th>Fryst nederbörd</th>
<th>Nederbördstyp</th>
            </tr>

            ${rows}

        </table>
    `;
}
async function loadYR() {

    const response = await fetch(
        "https://yr-proxy.mr-magoo21.workers.dev/"
    );

    const json = await response.json();

    const rows = json.properties.timeseries
        .slice(0, 24)
        .map(item => `

            <tr>
                <td>${item.time}</td>

                <td>${item.data.instant.details.air_temperature}</td>

                <td>${item.data.instant.details.wind_speed}</td>

                <td>${item.data.instant.details.wind_speed_of_gust}</td>

                <td>${item.data.instant.details.wind_from_direction}</td>

                <td>${item.data.instant.details.air_pressure_at_sea_level}</td>

                <td>${item.data.instant.details.relative_humidity}</td>

                <td>${item.data.instant.details.cloud_area_fraction}</td>

                <td>${item.data.next_1_hours?.details?.precipitation_amount ?? 0}</td>

                <td>${item.data.next_1_hours?.details?.probability_of_precipitation ?? 0}</td>

                <td>${item.data.next_1_hours?.details?.probability_of_thunder ?? 0}</td>

                <td>${item.data.next_1_hours?.summary?.symbol_code ?? "-"}</td>

            </tr>

        `)
        .join("");

    document.getElementById("yrOutput").innerHTML = `
        <table border="1">

            <tr>

                <th>Tid</th>
                <th>Temp</th>
                <th>Vind</th>
                <th>Kastvind</th>
                <th>Vindriktning</th>
                <th>Tryck</th>
                <th>Fukt</th>
                <th>Moln</th>
                <th>Regn</th>
                <th>Regn %</th>
                <th>Åska %</th>
                <th>Väderkod</th>

            </tr>

            ${rows}

        </table>
    `;
}
loadSMHI();
loadYR();

</script>

</body>
</html>
