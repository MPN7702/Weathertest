<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMHI Test</title>
</head>
<body>

<h1>SMHI Test</h1>

<div id="output">Laddar...</div>

<script>

async function loadSMHI() {

    const response = await fetch(
        "https://smhi-proxy.mr-magoo21.workers.dev/"
    );

    const json = await response.json();

    const rows = json.timeSeries
        .slice(0, 24)
        .map(item => `

        <tr>
            <td>${item.time}</td>
            <td>${item.data.air_temperature}</td>
            <td>${item.data.wind_speed}</td>
            <td>${item.data.wind_speed_of_gust}</td>
            <td>${item.data.precipitation_amount_mean_deterministic}</td>
        </tr>

        `)
        .join("");

    document.getElementById("output").innerHTML = `
        <table border="1">
            <tr>
                <th>Tid</th>
                <th>Temp</th>
                <th>Vind</th>
                <th>Kastvind</th>
                <th>Regn</th>
            </tr>
            ${rows}
        </table>
    `;
}

loadSMHI();

</script>

</body>
</html>
