name: Weather Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate weather.json
        run: |
          python update_weather.py
          
      - name: Kontrollera JSON
        run: |
          python3 -m json.tool weather.json > /dev/null

      - name: Commit weather.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weather.json

          git commit -m "Update weather cache" || true

          git push
      
